<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" role="img" aria-label="AEGIS logo with wordmark">
  <title>AEGIS — AI Agent Team Framework</title>
  <defs>
    <linearGradient id="shieldBodyW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="60%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <radialGradient id="innerGlowW" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Shield (scaled + positioned left) -->
  <g transform="translate(16,0) scale(0.7)">
    <path d="M 32 48 Q 32 24 56 24 L 200 24 Q 224 24 224 48 L 224 176 Q 224 244 128 296 Q 32 244 32 176 Z"
          fill="url(#shieldBodyW)" stroke="#0c4a6e" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 40 52 Q 40 32 60 32 L 196 32 Q 216 32 216 52 L 216 172 Q 216 238 128 286 Q 40 238 40 172 Z"
          fill="url(#innerGlowW)"/>
    <path d="M 88 224 L 128 72 L 168 224" stroke="#fef3c7" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="102" y1="174" x2="154" y2="174" stroke="#fef3c7" stroke-width="12" stroke-linecap="round"/>
    <g fill="#fbbf24">
      <circle cx="128" cy="52"  r="5"/>
      <circle cx="180" cy="74"  r="5"/>
      <circle cx="206" cy="128" r="5"/>
      <circle cx="194" cy="188" r="5"/>
      <circle cx="128" cy="244" r="5"/>
      <circle cx="62"  cy="188" r="5"/>
      <circle cx="50"  cy="128" r="5"/>
      <circle cx="76"  cy="74"  r="5"/>
    </g>
  </g>

  <!-- Wordmark: AEGIS + tagline -->
  <g transform="translate(210,0)">
    <text x="0" y="118"
          font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
          font-size="96"
          font-weight="900"
          fill="#0c4a6e"
          letter-spacing="12">AEGIS</text>
    <text x="2" y="160"
          font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
          font-size="22"
          font-weight="600"
          fill="#0ea5e9"
          letter-spacing="6">AI AGENT TEAM FRAMEWORK</text>
    <text x="2" y="192"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="18"
          font-style="italic"
          fill="#475569">"Context is King, Memory is Soul"</text>
  </g>
</svg>
