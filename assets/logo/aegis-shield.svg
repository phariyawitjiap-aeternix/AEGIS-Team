<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 320" width="256" height="320" role="img" aria-label="AEGIS shield logo">
  <title>AEGIS Shield</title>
  <defs>
    <linearGradient id="shieldBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="60%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <radialGradient id="innerGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Shield silhouette: rounded crown, tapered tip -->
  <path d="M 32 48
           Q 32 24 56 24
           L 200 24
           Q 224 24 224 48
           L 224 176
           Q 224 244 128 296
           Q 32 244 32 176
           Z"
        fill="url(#shieldBody)"
        stroke="#0c4a6e"
        stroke-width="4"
        stroke-linejoin="round"/>

  <!-- Inner radial glow for depth -->
  <path d="M 40 52
           Q 40 32 60 32
           L 196 32
           Q 216 32 216 52
           L 216 172
           Q 216 238 128 286
           Q 40 238 40 172
           Z"
        fill="url(#innerGlow)"/>

  <!-- Central "A" monogram: stylized, bold, with crossbar -->
  <path d="M 88 224
           L 128 72
           L 168 224"
        stroke="#fef3c7"
        stroke-width="14"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>
  <line x1="102" y1="174" x2="154" y2="174"
        stroke="#fef3c7"
        stroke-width="12"
        stroke-linecap="round"/>

  <!-- 8 orbiting dots = the agent team orbiting the core A -->
  <g fill="#fbbf24">
    <circle cx="128" cy="52"  r="5"/>
    <circle cx="180" cy="74"  r="5"/>
    <circle cx="206" cy="128" r="5"/>
    <circle cx="194" cy="188" r="5"/>
    <circle cx="128" cy="244" r="5"/>
    <circle cx="62"  cy="188" r="5"/>
    <circle cx="50"  cy="128" r="5"/>
    <circle cx="76"  cy="74"  r="5"/>
  </g>
</svg>
