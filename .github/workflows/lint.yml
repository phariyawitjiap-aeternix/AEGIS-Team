name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-docs:
    name: governance docs (version-headers + changelog)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: aegis-doc-canon lint
        run: node tools/aegis-doc-canon/lint.mjs

  skill-schema:
    name: skill frontmatter schema
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: aegis-doc-canon skill-frontmatter --lint
        run: node tools/aegis-doc-canon/skill-frontmatter.mjs --lint

  policy-audit:
    name: policy-without-test scanner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true   # advisory while we still have legacy claims
    steps:
      - uses: actions/checkout@v4
      - name: aegis-policy-audit (advisory)
        env:
          NO_COLOR: '1'
        run: bash tools/aegis-policy-audit.sh || true

  graph-build-determinism:
    name: knowledge graph builds byte-equal across runs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: First build
        run: node tools/aegis-brain-graph/build.mjs --full --quiet
      - name: Save snapshot
        run: |
          cp .aegis/brain/graph/nodes.ndjson /tmp/nodes-1.ndjson
          cp .aegis/brain/graph/edges.ndjson /tmp/edges-1.ndjson
      - name: Second build
        run: node tools/aegis-brain-graph/build.mjs --full --quiet
      - name: Assert byte-equal
        run: |
          cmp -s /tmp/nodes-1.ndjson .aegis/brain/graph/nodes.ndjson \
            && cmp -s /tmp/edges-1.ndjson .aegis/brain/graph/edges.ndjson \
            && echo "graph rebuild is deterministic ✓"

  shell-footgun-scan:
    name: shell footgun scan (cross-platform bash patterns)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: aegis-shell-footgun-scan (sprint-v13-02 AI-2 follow-on)
        # Detects 3 patterns that have bitten this codebase historically:
        # FOOTGUN-1: set -e + `[[ ]] && X` last-line of function
        # FOOTGUN-2: find -perm + (GNU-incompatible since 2005)
        # FOOTGUN-3: sed -i '' (BSD-only; GNU sed treats '' as the script)
        # Repo is currently CLEAN (97 files scanned, 0 footguns). Job blocks
        # any new instance from landing in main.
        run: bash tools/aegis-shell-footgun-scan.sh
